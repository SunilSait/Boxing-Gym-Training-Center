<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — IronJaw Boxing Gym</title>
    <meta name="description" content="Something big is coming to IronJaw Boxing Gym. Stay tuned for exciting updates.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>(function(){try{if(localStorage.getItem('ij-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('ij-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
</head>
<body>

<div class="cs-page">
    <div class="cs-bg-glow cs-bg-glow-1"></div>
    <div class="cs-bg-glow cs-bg-glow-2"></div>

    <div class="cs-topbar">
        <button onclick="toggleDir()" class="nav-icon-btn" id="rtlToggleNav" aria-label="Toggle RTL" title="Toggle RTL" style="background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1);color:#9090A0;">
            <span class="dir-indicator dir-label" style="font-size:0.625rem;font-weight:700;">RTL</span>
        </button>
        <button onclick="toggleTheme()" class="nav-icon-btn" id="darkToggleNav" aria-label="Toggle dark mode" title="Toggle dark mode" style="background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.1);color:#9090A0;">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="cs-content">
        <div class="cs-logo">
            <a href="index.html" aria-label="Go to homepage">
                <svg width="48" height="48" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C8102E"/><stop offset="100%" stop-color="#8B0000"/></linearGradient></defs>
                    <rect width="100" height="100" rx="18" fill="url(#logoBg)"/>
                    <path d="M32 30 Q32 20 40 20 L60 20 Q68 20 68 30 L68 55 Q68 72 50 78 Q32 72 32 55 Z" fill="none" stroke="white" stroke-width="5"/>
                    <path d="M42 38 L42 52 M58 38 L58 52" stroke="white" stroke-width="4" stroke-linecap="round"/>
                    <path d="M40 62 Q50 70 60 62" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                </svg>
            </a>
        </div>

        <h1 class="cs-title">Something <span>Big</span> Is Coming</h1>
        <p class="cs-desc">We're working on something exciting for IronJaw members. Be the first to know when we launch.</p>

        <div class="cs-countdown">
            <div class="cs-count-block">
                <div class="cs-count-num" id="cd-days">00</div>
                <div class="cs-count-label">Days</div>
            </div>
            <div class="cs-count-block">
                <div class="cs-count-num" id="cd-hours">00</div>
                <div class="cs-count-label">Hours</div>
            </div>
            <div class="cs-count-block">
                <div class="cs-count-num" id="cd-mins">00</div>
                <div class="cs-count-label">Minutes</div>
            </div>
            <div class="cs-count-block">
                <div class="cs-count-num" id="cd-secs">00</div>
                <div class="cs-count-label">Seconds</div>
            </div>
        </div>

        <form class="cs-notify-form" onsubmit="event.preventDefault(); alert('You will be notified when we launch!'); this.reset();">
            <input type="email" class="cs-notify-input" placeholder="Enter your email" required>
            <button type="submit" class="btn btn-primary">Notify Me</button>
        </form>

        <div style="margin-top:32px;">
            <a href="index.html" style="color:rgba(255,255,255,0.5);font-size:0.9rem;font-weight:450;"><i class="fas fa-arrow-left" style="margin-right:8px;"></i> Back to Home</a>
        </div>
    </div>
</div>

<script src="components.js"></script>
</body>
</html>
