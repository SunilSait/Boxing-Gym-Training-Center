<!DOCTYPE html>
<html lang="en" dir="ltr" id="root-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — IronJaw Boxing Gym</title>
    <meta name="description" content="Create your IronJaw member account. Start your free trial and join the boxing community.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script>(function(){try{if(localStorage.getItem('ij-dark')==='1'){document.documentElement.classList.add('dark')}if(localStorage.getItem('ij-rtl')==='1'){document.documentElement.setAttribute('dir','rtl')}}catch(e){}})();</script>
</head>
<body>

<div class="auth-page">
    <div class="auth-topbar">
        <button onclick="toggleDir()" class="nav-icon-btn" id="rtlToggleNav" aria-label="Toggle RTL" title="Toggle RTL">
            <span class="dir-indicator dir-label" style="font-size:0.625rem;font-weight:700;">RTL</span>
        </button>
        <button onclick="toggleTheme()" class="nav-icon-btn" id="darkToggleNav" aria-label="Toggle dark mode" title="Toggle dark mode">
            <i class="fas fa-moon"></i>
        </button>
    </div>

    <div class="auth-card">
        <div class="auth-logo">
            <a href="index.html" aria-label="Go to homepage">
                <svg width="42" height="42" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs><linearGradient id="logoBg" x1="0%" y1="0%" x2="100%" y2="100%"><stop offset="0%" stop-color="#C8102E"/><stop offset="100%" stop-color="#8B0000"/></linearGradient></defs>
                    <rect width="100" height="100" rx="18" fill="url(#logoBg)"/>
                    <path d="M32 30 Q32 20 40 20 L60 20 Q68 20 68 30 L68 55 Q68 72 50 78 Q32 72 32 55 Z" fill="none" stroke="white" stroke-width="5"/>
                    <path d="M42 38 L42 52 M58 38 L58 52" stroke="white" stroke-width="4" stroke-linecap="round"/>
                    <path d="M40 62 Q50 70 60 62" stroke="white" stroke-width="3.5" fill="none" stroke-linecap="round"/>
                </svg>
            </a>
        </div>

        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join IronJaw and start your free trial today</p>

        <form class="auth-form" onsubmit="event.preventDefault(); alert('Account created! Redirecting to dashboard...'); window.location.href='dashboard.html';">
            <div class="form-group">
                <label class="form-label" for="signupFirstName">First Name</label>
                <input type="text" class="form-input" id="signupFirstName" placeholder="John" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signupLastName">Last Name</label>
                <input type="text" class="form-input" id="signupLastName" placeholder="Doe" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signupEmail">Email Address</label>
                <input type="email" class="form-input" id="signupEmail" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label class="form-label" for="signupPhone">Phone Number</label>
                <input type="tel" class="form-input" id="signupPhone" placeholder="+1 (555) 000-0000">
            </div>
            <div class="form-group">
                <label class="form-label" for="signupPassword">Password</label>
                <div class="password-wrap">
                    <input type="password" class="form-input" id="signupPassword" placeholder="Create a strong password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signupPassword', this)" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div class="form-group">
                <label class="form-label" for="signupConfirm">Confirm Password</label>
                <div class="password-wrap">
                    <input type="password" class="form-input" id="signupConfirm" placeholder="Confirm your password" required>
                    <button type="button" class="password-toggle" onclick="togglePasswordVisibility('signupConfirm', this)" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <div style="margin-bottom:20px;">
                <label class="remember-check">
                    <input type="checkbox" required> I agree to the <a href="coming-soon.html" style="color:var(--primary);font-weight:600;">Terms of Service</a> and <a href="coming-soon.html" style="color:var(--primary);font-weight:600;">Privacy Policy</a>
                </label>
            </div>
            <button type="submit" class="btn btn-primary">Create Account</button>
        </form>

        <div class="auth-divider"><span>or sign up with</span></div>

        <div class="social-logins">
            <button type="button" class="social-btn" onclick="alert('Signing up with Google...'); window.location.href='dashboard.html'">
                <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.9 33.5 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.2-2.7-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 15.5 18.8 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35.1 26.7 36 24 36c-5.3 0-9.8-3.5-11.3-8.3l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.2-2.7-.4-3.9z"/></svg>
                Sign up with Google
            </button>
            <button type="button" class="social-btn" onclick="alert('Signing up with Apple...'); window.location.href='dashboard.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 20.28c-.98.95-2.05.88-3.08.4-1.09-.5-2.08-.48-3.24 0-1.44.62-2.2.44-3.06-.4C2.79 15.25 3.51 7.59 9.05 7.31c1.35.07 2.29.74 3.08.8 1.18-.24 2.31-.93 3.57-.84 1.51.12 2.65.72 3.4 1.8-3.12 1.87-2.38 5.98.48 7.13-.57 1.5-1.31 2.99-2.54 4.09zM12.03 7.25c-.15-2.23 1.66-4.07 3.74-4.25.32 2.32-1.96 4.41-3.74 4.25z"/></svg>
                Sign up with Apple
            </button>
            <button type="button" class="social-btn" onclick="alert('Signing up with Facebook...'); window.location.href='dashboard.html'">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12.07C24 5.41 18.63 0 12 0S0 5.41 0 12.07c0 6.02 4.39 11.02 10.13 11.93v-8.44H7.08v-3.49h3.04V9.41c0-3.02 1.79-4.69 4.53-4.69 1.31 0 2.69.24 2.69.24v2.97h-1.51c-1.49 0-1.96.93-1.96 1.89v2.26h3.33l-.53 3.49h-2.8v8.44C19.61 23.09 24 18.09 24 12.07z"/></svg>
                Sign up with Facebook
            </button>
        </div>

        <p class="auth-footer-text">Already have an account? <a href="login.html">Sign In</a></p>
    </div>
</div>

<script src="components.js"></script>
</body>
</html>
